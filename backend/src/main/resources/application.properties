server.port=${PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle_telemetry?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (HS256) — change secret in any non-dev environment.
jwt.secret=${JWT_SECRET:dev-secret-change-me-please-this-key-must-be-at-least-32-bytes-for-hs256}
jwt.expiry-hours=24
jwt.cookie-name=auth_token
# Set COOKIE_SECURE=true when served over HTTPS
jwt.cookie-secure=${COOKIE_SECURE:false}
jwt.cookie-samesite=${COOKIE_SAMESITE:Lax}

# CORS
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# Seeding (initial historical backfill — runs once if vehicle table is empty)
telemetry.seed.enabled=true
telemetry.seed.days=30
telemetry.seed.interval-minutes=${SEED_INTERVAL_MINUTES:15}

# Simulator (continuous live data generation — runs every tick-ms)
telemetry.simulator.enabled=true
telemetry.simulator.tick-ms=60000
